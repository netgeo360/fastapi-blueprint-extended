# ── fastapi-blueprint input spec ────────────────────────────────────────────
# This YAML file defines your FastAPI project.
# Run: fastapi-blueprint generate --spec project.yaml --output ./my_project

project:
  name: "task-manager"
  description: "A simple task management API"
  version: "0.0.0"
  python_version: "3.12"
  database: postgresql
  generate_requirements: true          
  generate_tests: true
  generate_docker: true
  generate_alembic: false
  generate_makefile: true
  generate_entrypoint: true
  url: https://www.example-api.com
  email: test@test.com

entrypoint:  

 # git_repo_url: https://github.com/repo/repo.git
  app_port: 8000
  gunicorn_workers: 5
  app_module: "app:app"
  worker_class: "uvicorn.workers.UvicornH11Worker"
  gunicorn_timeout: 1200
  log_level: "info"

makefile:
  docker_network_name: "company_secure_sandbox"
  docker_subnet: "172.27.0.0/26"
  generate_ips_count: 2

# ── Routers ─────────────────────────────────────────────────────────────────
routers:

  - name: tasks
    prefix: /tasks
    tag: Tasks
    endpoints:

      - name: create_task
        method: POST
        path: /
        summary: "Create a new task"
        request_schema: TaskCreate
        response_schema: TaskResponse
        status_code: 201
        auth: true

      - name: get_task_by_id
        method: GET
        path: /{task_id}
        summary: "Get task by ID"
        response_schema: TaskResponse
        status_code: 200
        auth: true
        path_params:
          - name: task_id
            type: int
            gt: 0

      - name: get_all_tasks
        method: GET
        path: /
        summary: "Get all tasks with pagination"
        response_schema: TaskListResponse
        status_code: 200
        auth: true
        query_params:
          - name: page
            type: int
            default: 1
          - name: page_size
            type: int
            default: 20

      - name: delete_task
        method: DELETE
        path: /{task_id}
        summary: "Delete a task"
        status_code: 204
        auth: true
        path_params:
          - name: task_id
            type: int
            gt: 0

  - name: users
    prefix: /users
    tag: Users
    endpoints:

      - name: create_user
        method: POST
        path: /
        summary: "Register a new user"
        request_schema: UserCreate
        response_schema: UserResponse
        status_code: 201
        auth: false

      - name: get_user_by_id
        method: GET
        path: /{user_id}
        summary: "Get user by ID"
        response_schema: UserResponse
        status_code: 200
        auth: true
        path_params:
          - name: user_id
            type: int
            gt: 0

# ── Schemas ──────────────────────────────────────────────────────────────────
schemas:

  - name: TaskCreate
    fields:
      - name: title
        type: str
        min_length: 1
        max_length: 255
      - name: description
        type: str
        required: false
      - name: priority
        type: int
        ge: 1
        le: 5
        default: 3

  - name: TaskResponse
    from_attributes: true
    fields:
      - name: id
        type: int
      - name: title
        type: str
      - name: description
        type: str | None
      - name: priority
        type: int
      - name: created_at
        type: datetime
      - name: username
        type: str

  - name: TaskListResponse
    fields:
      - name: data
        type: list[TaskResponse]
      - name: total_items
        type: int
      - name: total_pages
        type: int
      - name: current_page
        type: int

  - name: UserCreate
    fields:
      - name: username
        type: str
        min_length: 3
        max_length: 50
      - name: email
        type: EmailStr
      - name: password
        type: str
        min_length: 8

  - name: UserResponse
    from_attributes: true
    fields:
      - name: id
        type: int
      - name: username
        type: str
      - name: email
        type: EmailStr
      - name: created_at
        type: datetime

docker_web:
  base_image: "python:3.12-slim-bookworm"
  python_version: "3.12"
  timezone: "Europe/Athens"
  web_external_port: 8001
  web_internal_port: 8000           
  workers: 5                
  include_compose: true
  services:
    - postgresql

docker_nginx:
  base_image: "nginx:1.25.2"
  nginx_external_port: 443
  nginx_internal_port: 443
  o_value:  "Company Name"
  cn_value: "task.manager.localhost"
  ou_value: "Company Team"   
  include_compose: true
  timezone: "Europe/Athens"

req_cnf:
  sans_ips:
    - "10.0.0.100"
  sans_dns:
    - "task.manager.localhost"

nginx_conf:
  upstream_host: "task_manager_web"
  conf_external_port: 443
  conf_internal_port: 443
  upstream_internal_port: 8000
  proxy_connect_timeout: 1200
  proxy_send_timeout: 1200
  proxy_read_timeout: 1200
  send_timeout: 10
  client_max_body_size: "250M"
  ssl_certificate: "/etc/nginx/server.crt"
  ssl_certificate_key: "/etc/nginx/server.key"
  cn_value: "task.manager.localhost"
